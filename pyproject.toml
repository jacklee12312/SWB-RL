[project]
name = "swb-rl"
version = "0.1.0"
description = "Shadowverse card database and minimal reinforcement-learning game engine"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
rl = [
    "numpy>=2.3,<3",
    "gymnasium>=1.3,<2",
    "pettingzoo>=1.26.1,<2",
]
train = [
    "torch>=2.6,<2.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
