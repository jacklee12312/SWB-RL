[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "swb-rl"
version = "0.1.0"
description = "Shadowverse card database and minimal reinforcement-learning game engine"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
rl = [
    "numpy>=2.3,<3",
    "gymnasium>=1.3,<2",
    "pettingzoo>=1.26.1,<2",
]
train = [
    "psutil>=6,<8",
    "torch>=2.6,<2.14",
]
qr = [
    "Pillow>=10,<13",
    "zxing-cpp>=3,<4",
]

[tool.setuptools.packages.find]
include = ["swb*"]
exclude = ["data*", "docs*", "releases*", "scripts*", "simulator-ui*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
